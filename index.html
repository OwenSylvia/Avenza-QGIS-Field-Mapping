<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Refugio Pass Field Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    html, body, #map { height: 100%; margin: 0; }
    .leaflet-popup-content { width: 240px !important; }
    .popup-title { font-weight: bold; font-size: 14px; margin-bottom: 4px; }
    .popup-type { color: #555; font-size: 12px; margin-bottom: 6px; }
    .popup-desc { font-size: 13px; line-height: 1.4; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    const map = L.map('map').setView([34.5, -120.05], 13);

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19,
      attribution: 'Esri, Maxar, Earthstar Geographics'
    }).addTo(map);

    function bindPopup(feature, layer) {
      const p = feature.properties;
      const title = p.name || p.Name || 'Point';
      const type = p.type || '';
      const desc = p.description || 'No description yet.';
      layer.bindPopup(
        `<div class="popup-title">${title}</div>` +
        (type ? `<div class="popup-type">${type}</div>` : '') +
        `<div class="popup-desc">${desc}</div>`
      );
    }

    // Tracking line — loads first so it sits underneath the points
    fetch('Refugio.Tracking.Line.Final.geojson')
      .then(r => r.json())
      .then(data => {
        L.geoJSON(data, {
          style: { color: '#ff8c00', weight: 3, opacity: 0.9 }
        }).addTo(map);
      })
      .catch(err => console.error('Refugio.Tracking.Line.Final.geojson failed to load:', err));

    fetch('vegetation.Final.geojson')
      .then(r => r.json())
      .then(data => {
        L.geoJSON(data, {
          pointToLayer: (f, latlng) => L.circleMarker(latlng, {
            radius: 8, fillColor: '#2e7d32', fillOpacity: 0.9, color: '#fff', weight: 2
          }),
          onEachFeature: bindPopup
        }).addTo(map);
      })
      .catch(err => console.error('vegetation.Final.geojson failed to load:', err));

    fetch('trail.conditions.Final.geojson')
      .then(r => r.json())
      .then(data => {
        L.geoJSON(data, {
          pointToLayer: (f, latlng) => {
            const sev = (f.properties.type || '').toLowerCase();
            const color = sev.includes('severe') ? '#c62828' :
                          sev.includes('moderate') ? '#ef6c00' : '#f9a825';
            return L.circleMarker(latlng, {
              radius: 8, fillColor: color, fillOpacity: 0.9, color: '#fff', weight: 2
            });
          },
          onEachFeature: bindPopup
        }).addTo(map);
      })
      .catch(err => console.error('trail.conditions.Final.geojson failed to load:', err));
  </script>
</body>
</html>
